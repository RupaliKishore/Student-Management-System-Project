<!DOCTYPE html>
<html lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> 	

</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Student Management System</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto">
      <li class="nav-item active">
        <a class="nav-link" href="index.html">Home </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="index.html">About</a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" href="#">Contact Us</a>
      </li>
      
        <li class="nav-item">
        <a class="nav-link" th:href="@{/home}">New Student</a>
      </li>
      
       <li class="nav-item">
        <a class="nav-link" th:href="@{/dashboard}"> Students</a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" href="#Login">Login</a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" th:href="@{/home}">Register</a>
      </li>
    </ul>
    
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Submit</button>
 </div>   
  </div>
</nav>

  <div class="container pt-5">
     <div class="row">
         <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-primary">
                     <h2 class="text-center "> Student Details  </h2>
                </div>
                <div class="card-body">
                   
                  <p> First Name    : <strong th:text="${viewstudent.firstname}"> </strong> </p>
                  <p> Last Name     : <strong th:text="${viewstudent.lastname}"> </strong> </p>
                  <p> Email         : <strong th:text="${viewstudent.email}"> </strong> </p>
                  <p> Password      : <strong th:text="${viewstudent.password}"> </strong> </p>
                  <p> Mobile No.    : <strong th:text="${viewstudent.mobnum}"> </strong> </p>
                  <p> Date of Birth : <strong th:text="${viewstudent.dob}"> </strong> </p>
                  <p> Gender        : <strong th:text="${viewstudent.gender}"> </strong> </p>
                  <p> Cource        : <strong th:text="${viewstudent.cource}"> </strong> </p>
                  <p> City          : <strong th:text="${viewstudent.city}"> </strong> </p>
                  <p> Pin Code      : <strong th:text="${viewstudent.pincode}"> </strong> </p>
                
                </div>
            </div>
         </div>
     </div>
  </div>

</body>
</html>
