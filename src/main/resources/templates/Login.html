<!DOCTYPE html>
<html xmlns:th="http:www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body >
<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4" style="width: 400px;">

<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <h2 class="fw-bold text-center mb-2">Student Login</h2>
        <p class="text-muted text-center mb-4">
            Login to your Student Management System
        </p>

        <form th:action="@{/login}" th:object="${student}" method="post">

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control form-control-lg"
                       placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control form-control-lg"
                       placeholder="Enter Password">
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label"> Remember Me </label>
                </div>

                <a th:href="@{/forgot-password}" class="text-decoration-none">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            Don't have an account?
            <a th:href="@{/register}" class="text-decoration-none">
                Register
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
