<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>


<!-- Register Form -->
<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center">Student Registration</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/saveregister}" th:object="${saveStudent}"  method="post">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> First Name</label>
                                <input type="text" class="form-control" th:field="*{firstname}" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastname}" required>
                            </div>

                          
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control"  th:field="*{password}" required>
                               
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control"  th:field="*{mobnum}" required>
                                
                            </div>
                            
                            
                              <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" th:field="*{dob}" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label d-block">Gender</label>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" value="Male">
                                    
                                    <label class="form-check-label">Male</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}"value="Female">
                                    <label class="form-check-label">Female</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" value="Other">
                                    <label class="form-check-label">Other</label>
                                </div>
                            </div>
                            
                            
                             <div class="col-md-6 mb-3">
                                <label class="form-label">Cource</label>
                                <input type="text" class="form-control" th:field="*{cource}" required>
                               
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" th:field="*{city}" required>
                                
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">PIN Code</label>
                                <input type="text" class="form-control"  th:field="*{pincode}" required>
                            </div>

                        </div>

                        <div class="text-center">

                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>

                            <button type="reset"  class="btn btn-secondary">
                                Reset
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
