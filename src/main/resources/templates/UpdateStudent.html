<!DOCTYPE html>
<html xmlns:th="http:www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body >
<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center"> Update Student </h3>
                </div>

                <div class="card-body">

              <form th:action="@{/saveupdateStudent}" th:object="${update}" method="post">
                  <div class="row">
                  <input type="hidden" th:field="*{id}">
                         <div class="col-md-6 mb-3">
                                <label class="form-label"> First Name</label>
                                <input type="text" class="form-control" th:field="*{firstname}">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastname}">
                            </div>

                          
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" th:field="*{password}">
                               
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control"  th:field="*{mobnum}">
                                
                            </div>
                            
                            
                              <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" th:field="*{dob}">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label d-block">Gender</label>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" value="Male">
                                    
                                    <label class="form-check-label">Male</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}"  value="Female">
                                    <label class="form-check-label">Female</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" th:field="*{gender}"  value="Other">
                                    <label class="form-check-label">Other</label>
                                </div>
                            </div>
                            
                            
                             <div class="col-md-6 mb-3">
                                <label class="form-label">Cource</label>
                                <input type="text" class="form-control" th:field="*{cource}">
                               
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" th:field="*{city}">
                                
                            </div>


                            <div class="col-md-6 mb-3">
                                <label class="form-label">PIN Code</label>
                                <input type="text" class="form-control"  th:field="*{pincode}">
                            </div>
                            
            <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label"> Remember Me </label>
                </div>

            </div>
              <div class="text-center">

                            <button type="submit" class="btn btn-primary ">
                                Register
                            </button>

                            <button type="reset"  class="btn btn-secondary">
                                Reset
                            </button>

                  </div> 
                       </div>
            
       
        </form>


    </div>

</div>
</div>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
